# --- Sony Bravia TV (IP Control, Pre-Shared Key authentication) ---------------
TV_IP=10.0.10.125
TV_PORT=80
TV_PSK=sony
TV_HDMI_PORT=4

# --- Retry behaviour ----------------------------------------------------------
# After resume the NIC needs ~12 s to come back, hence the generous defaults.
# Tip: TV_OFF_ATTEMPTS=2 avoids a long wait before suspend if the TV is already off.
TV_TIMEOUT=5
TV_RETRY_DELAY=3
TV_ON_ATTEMPTS=10
TV_OFF_ATTEMPTS=10
TV_HDMI_ATTEMPTS=5
TV_HDMI_DELAY=2

# --- Controller-triggered suspend ---------------------------------------------
# Seconds to wait after an 8BitDo dongle changes state before deciding to suspend.
SUSPEND_DELAY=5
# Steam Controller: consecutive silent probes (~2 s each) before it counts as off.
STEAM_SILENT_PROBES=5
